      match: "httpdns"
      policy: REJECT
  - domain_keyword:
      match: "httpsdns"
      policy: REJECT
  - user_agent:
      match: "httpdns*"
      policy: REJECT
  - user_agent:
      match: "httpsdns*"
      policy: REJECT
  - and:
      match:
        - url_regex:
            match: "^http:\\/\\/119\\.29\\.29\\.90\\/d\\?"
        - user_agent:
            match: "%E5%98%80%E5%97%92%E5%87%BA%E8%A1%8C*"
      policy: DIRECT
  - and:
