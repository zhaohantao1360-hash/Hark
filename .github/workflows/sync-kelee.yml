name: 同步可莉模块到 Egern

on:
  schedule:
    - cron: "0 20 * * 0"   # 每周一 04:00（北京时间）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/kelee2egern.py
      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add *-hark.yaml
          if git diff --cached --quiet; then echo "无变化"; else git commit -m "自动同步可莉模块 $(date -u +%F)" && git push; fi
