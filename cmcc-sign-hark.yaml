name: 中国移动签到领流量（Hark）
description: 每天自动在「中国移动」App 的「签到领流量」签到，并代领累计/连签奖励（流量券、话费券）。首次使用：在模块设置里填手机号，再打开「中国移动」App 停留几秒，收到「已获取 App 登录信息」即可（和移动小组件同一原理，配合小组件保活更稳）。
author: Hark（接口参考 yupaiLy/cmcc-auto-checkin）
icon: antenna.radiowaves.left.and.right

env_schema:
  CMCC_PHONE:
    name: 手机号
    description: 11 位移动手机号（必填，用来登录签到活动）
  CMCC_PROVINCE:
    name: 省份编码
    description: 北京 100（默认）；其他省份按中国移动省编码填
    default_value: '100'
  CMCC_CITY:
    name: 城市编码
    description: 北京 010（默认）
    default_value: '010'
  CMCC_CLAIM:
    name: 自动领奖励
    description: 签到后顺手领取累计/连签奖励（热门奖品库存有限，领不到属正常）
    default_value: 'true'
    options: ['true', 'false']
  CMCC_NOTIFY:
    name: 通知
    description: all=签到和领奖都通知；fail=只在失败或需要你操作时通知；off=不通知
    default_value: all
    options: [all, fail, 'off']
  CMCC_CAPTURE:
    name: 抓取签到凭证
    description: 打开签到页时自动更新凭证。关掉后凭证过期不会自动恢复
    default_value: 'true'
    options: ['true', 'false']

mitm:
  hostnames:
    includes:
      - wx.10086.cn
      - client.app.coc.10086.cn
      - 10086.online-cmcc.cn
      - h5.bj.10086.cn

scriptings:
  - http_request:
      name: 移动签到凭证-请求
      match: '^https:\/\/wx\.10086\.cn\/'
      script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/cmcc-sign-hark.js?v=20261022-1015
      body_required: true
      timeout: 30
  - http_response:
      name: 移动签到凭证-响应
      match: '^https:\/\/wx\.10086\.cn\/'
      script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/cmcc-sign-hark.js?v=20261022-1015
      body_required: true
      timeout: 30
  - http_request:
      name: 北京签到页-请求
      match: '^https:\/\/h5\.bj\.10086\.cn\/'
      script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/cmcc-sign-hark.js?v=20261022-1015
      body_required: true
      timeout: 15
  - http_response:
      name: 北京签到页-响应
      match: '^https:\/\/h5\.bj\.10086\.cn\/'
      script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/cmcc-sign-hark.js?v=20261022-1015
      body_required: true
      timeout: 15
  - http_request:
      name: 移动签到页票据-请求
      match: '^https?:\/\/client\.app\.coc\.10086\.cn\/leadeon-abilityopen-biz\/BN\/obtainToken\/getBigNetToken'
      script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/cmcc-sign-hark.js?v=20261022-1015
      body_required: true
      timeout: 10
  - http_response:
      name: 移动签到页票据-响应
      match: '^https?:\/\/client\.app\.coc\.10086\.cn\/leadeon-abilityopen-biz\/BN\/obtainToken\/getBigNetToken'
      script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/cmcc-sign-hark.js?v=20261022-1015
      body_required: true
      timeout: 10
  - http_request:
      name: 移动App登录信息-请求
      match: '^https?:\/\/(client\.app\.coc\.10086\.cn|10086\.online-cmcc\.cn)(:\d+)?\/'
      script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/cmcc-sign-hark.js?v=20261022-1015
      timeout: 10
  - http_response:
      name: 移动App登录信息-响应
      match: '^https?:\/\/(client\.app\.coc\.10086\.cn|10086\.online-cmcc\.cn)(:\d+)?\/'
      script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/cmcc-sign-hark.js?v=20261022-1015
      timeout: 10
  - schedule:
      name: 移动每日签到-Hark
      cron: '18 9,13,20 * * *'
      script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/cmcc-sign-hark.js?v=20261022-1015
      timeout: 90
      env:
        MODE: sign
  - generic:
      name: 移动签到-Hark
      script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/cmcc-sign-hark.js?v=20261022-1015
      timeout: 60

widgets:
  - name: 移动签到-Hark
    script_name: 移动签到-Hark
