<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZHT 收藏夹 · 插件与分流</title>
<meta name="description" content="ZHT 的 Loon 插件、分流规则、Egern 模块与常用网站，一键安装。">
<meta name="theme-color" content="#09090b">
<style>
:root{--bg:#ffffff;--fg:#09090b;--muted:#71717a;--card:#ffffff;--border:#e4e4e7;--sec:#f4f4f5;--pri:#18181b;--pri-fg:#fafafa;--ring:rgba(24,24,27,.12);--ok:#16a34a}
html.dark{--bg:#09090b;--fg:#fafafa;--muted:#a1a1aa;--card:#0c0c0f;--border:#27272a;--sec:#18181b;--pri:#fafafa;--pri-fg:#18181b;--ring:rgba(250,250,250,.12);--ok:#4ade80}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Inter","Helvetica Neue",sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:9px;background:var(--pri);color:var(--pri-fg);display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.5px}
.sbtn{flex:1;max-width:340px;margin-left:auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--muted);font-size:14px;cursor:pointer;text-align:left}
.sbtn kbd{margin-left:auto;font:500 10px ui-monospace,Menlo,monospace;border:1px solid var(--border);background:var(--sec);border-radius:5px;padding:2px 6px;color:var(--fg)}
.ibtn{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;background:var(--bg);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.ibtn:hover,.sbtn:hover{background:var(--sec)}
.ibtn svg{width:18px;height:18px}
.hero{text-align:center;margin:48px 0 26px;animation:up .6s both}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:600;letter-spacing:-.02em}
.hero p{color:var(--muted);max-width:560px;margin:12px auto 0;font-size:16px;line-height:1.6}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--sec);margin:0 auto 18px;overflow-x:auto;max-width:100%}
.tabsw{text-align:center}
.tab{border:0;background:none;padding:8px 16px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab span{font-size:12px;opacity:.6;margin-left:4px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.chip{border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--muted);cursor:pointer}
.chip.on{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-bottom:60px}
.card{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;background:var(--card);transition:transform .25s,box-shadow .25s,border-color .25s;animation:up .5s both;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px -12px var(--ring);border-color:color-mix(in srgb,var(--fg) 22%,var(--border))}
.card.off{opacity:.62}
.ch{padding:24px 18px 6px;text-align:center}
.av{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--tint,var(--sec));display:grid;place-items:center;font-weight:600;font-size:22px;overflow:hidden;color:var(--fg)}
.av img{width:42px;height:42px;object-fit:contain;border-radius:10px}
.card h3{font-size:18px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{padding:4px 22px 0;text-align:center;flex:1}
.cb p{color:var(--muted);font-size:13.5px;line-height:1.5;height:60px;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cf{padding:14px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:11px}
.inst{width:100%;height:40px;border:0;border-radius:10px;background:var(--pri);color:var(--pri-fg);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:opacity .2s}
.inst:hover{opacity:.88}
.inst svg{width:16px;height:16px}
.more{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:none;border:0}
.more:hover{color:var(--fg)}
.tag{position:absolute;top:12px;right:12px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--sec);color:var(--muted)}
.filters{position:sticky;top:68px;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 0 2px;margin:0 -24px 22px;padding-left:24px;padding-right:24px}
.filters .tabs{margin-bottom:12px}.filters .chips{margin-bottom:10px}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.stats span{font-size:12.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 11px}
.stats b{color:var(--fg);font-weight:600}
.pill{display:inline-block;margin-top:7px;font-size:11.5px;color:var(--muted);background:var(--sec);border-radius:6px;padding:2px 8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.d{color:#16a34a;background:color-mix(in srgb,#16a34a 12%,transparent)}
.pill.r{color:#dc2626;background:color-mix(in srgb,#dc2626 12%,transparent)}
.pill.p{color:#2563eb;background:color-mix(in srgb,#2563eb 12%,transparent)}
html.dark .pill.d{color:#4ade80}html.dark .pill.r{color:#f87171}html.dark .pill.p{color:#60a5fa}
.chip span{opacity:.55;margin-left:3px;font-size:11px}
.empty{text-align:center;color:var(--muted);padding:60px 0;display:none}
footer{border-top:1px solid var(--border);padding:26px 0 40px;color:var(--muted);font-size:13px;text-align:center;line-height:1.9}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.mask.show{display:flex}
.panel{width:100%;max-width:560px;background:var(--bg);border:1px solid var(--border);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);overflow:hidden;animation:pop .18s both}
.cmdin{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border)}
.cmdin input{flex:1;height:52px;border:0;background:none;color:var(--fg);font-size:15px;outline:none}
.res{max-height:52vh;overflow:auto;padding:6px}
.ri{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer}
.ri.sel,.ri:hover{background:var(--sec)}
.ri .av{width:32px;height:32px;margin:0;font-size:13px}
.ri .av img{width:22px;height:22px}
.ri b{font-weight:500;font-size:14px;display:block}
.ri small{color:var(--muted);font-size:12px}
.ri em{margin-left:auto;font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
.det{padding:28px 26px 24px;text-align:center}
.det .av{width:76px;height:76px}
.det .av img{width:50px;height:50px}
.det h2{font-size:24px;font-weight:600}
.det .sub{color:var(--muted);font-size:14px;line-height:1.6;margin:10px 0 18px}
.kv{text-align:left;border:1px solid var(--border);border-radius:12px;margin-bottom:18px}
.kv div{display:flex;gap:12px;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border)}
.kv div:last-child{border:0}
.kv span{color:var(--muted);width:56px;flex-shrink:0}
.kv code{font:12px ui-monospace,Menlo,monospace;word-break:break-all}
.btns{display:flex;gap:10px}
.btns .inst{flex:1}
.ghost{background:var(--sec)!important;color:var(--fg)!important}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--pri);color:var(--pri-fg);padding:9px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (max-width:640px){
  .wrap{padding:0 16px}.sbtn span,.sbtn kbd{display:none}.sbtn{flex:0 0 38px;width:38px;padding:0;justify-content:center;margin-left:auto}
  .hero{margin:28px 0 18px}.hero p{font-size:14px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .filters{margin:0 -16px 16px;padding:8px 16px 0}.chips{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}.chip{flex-shrink:0}
  .tabs{display:flex;width:100%}.tab{flex:1;padding:8px 6px;font-size:13px}
  .ch{padding:20px 12px 6px}.av{width:52px;height:52px;margin-bottom:10px}.av img{width:34px;height:34px}
  .card h3{font-size:15px}.cb{padding:0 12px}.cb p{font-size:12px;height:36px;-webkit-line-clamp:2}.pill{font-size:10.5px;margin-top:5px}.more{font-size:12px}.cf{padding:12px 12px 16px}.inst{height:36px;font-size:13px}
  .tag{top:8px;right:8px;font-size:10px;padding:1px 6px}
  .mask{padding:8vh 10px 10px}
}
</style>
</head>

TABS.forEach(t=>t.items.forEach((it,i)=>{it.type=t.type;it.id=t.k+i}));
const ALL=TABS.flatMap(t=>t.items);
const ICO={plugin:'<path d="M14 7V5a2 2 0 1 0-4 0v2H6a1 1 0 0 0-1 1v4h2a2 2 0 1 1 0 4H5v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/>',down:'<path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/>',open:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'};
const svg=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICO[k]}</svg>`;
const TINT=["#dbeafe","#ede9fe","#fce7f3","#ffedd5","#dcfce7","#cffafe","#fee2e2","#f3e8ff"];
function avatar(it){
  const ch=esc([...(it.name||"?")][0]).toUpperCase();
  const tint=it.icon?"":`style="--tint:${TINT[[...(it.name||"")].reduce((a,c)=>a+c.charCodeAt(0),0)%TINT.length]};color:#18181b"`;
  return `<div class="av" ${tint}>${it.icon?`<img src="${esc(it.icon)}" loading="lazy" alt="" onerror="this.parentNode.textContent='${ch}'">`:ch}</div>`;
}
function link(it){
  const u=encodeURIComponent(it.url);
  if(it.type==="plugin")return "loon://import?plugin="+u;
  if(it.type==="rule")return "loon://import?rules="+u;
  if(it.type==="egern")return "egern:/modules/new?name="+encodeURIComponent(it.name)+"&url="+u;
  return it.url;
}
const btnText=it=>innerWidth<640?"安装":it.type==="egern"?"安装到 Egern":"安装到 Loon";
function pill(it){
  if(it.type==="rule"){const c=it.policy==="DIRECT"?"d":it.policy==="REJECT"?"r":"p";return `<span class="pill ${c}">${esc(sub(it))}</span>`}
  return `<span class="pill">${esc(it.cat)}</span>`;
}
function sub(it){return it.type==="rule"?(it.policy==="DIRECT"?"直连":it.policy==="REJECT"?"拦截":"走「"+it.policy+"」"):""}
function renderTabs(){
  $("tabs").innerHTML=TABS.map(t=>`<button class="tab${t.k===tab?" on":""}" onclick="setTab('${t.k}')">${t.t}<span>${t.items.length}</span></button>`).join("");
  const T=TABS.find(t=>t.k===tab);const cats=["全部",...new Set(T.items.map(i=>i.cat))];
  const cnt=c=>c==="全部"?T.items.length:T.items.filter(i=>i.cat===c).length;
  $("chips").innerHTML=cats.map(c=>`<button class="chip${c===chip?" on":""}" onclick="setChip('${c}')">${c}<span>${cnt(c)}</span></button>`).join("");
}
function render(){
  renderTabs();
  const T=TABS.find(t=>t.k===tab);const list=T.items.filter(i=>chip==="全部"||i.cat===chip).sort((a,b)=>b.on-a.on);
  $("grid").innerHTML=list.map((it,n)=>{
    const st=it.on?"":`<span class="tag">未启用</span>`;
    const d=it.desc||sub(it)||"";
    return `<div class="card${it.on?"":" off"}" style="animation-delay:${Math.min(n,12)*35}ms">${st}
      <div class="ch">${avatar(it)}<h3>${esc(it.name)}</h3>${pill(it)}</div>
      <div class="cb"><p>${esc(it.type==="rule"?(it.desc||""):d)}</p></div>
      <div class="cf"><a class="inst" href="${esc(link(it))}" >${svg("down")}${btnText(it)}</a>
      <button class="more" onclick="detail('${it.id}')">详情 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div></div>`}).join("");
  $("empty").style.display=list.length?"none":"block";
}
function setTab(k){tab=k;chip="全部";localStorage.setItem("zht2_tab",k);render();scrollTo({top:0,behavior:"smooth"})}
function setChip(c){chip=c;render()}
function detail(id){
  const it=ALL.find(x=>x.id===id);if(!it)return;hide("cmd");
  const rows=[["类型",{plugin:"Loon 插件",rule:"Loon 分流",egern:"Egern 模块"}[it.type]+" · "+it.cat]];
  if(it.policy)rows.push(["策略",it.policy]);
  rows.push(["状态",it.on?"启用中":"未启用"]);
  rows.push(["地址",`<code>${esc(it.url)}</code>`]);
  $("det").innerHTML=`${avatar(it)}<h2>${esc(it.name)}</h2><p class="sub">${esc(it.desc||sub(it)||"—")}</p>
   <div class="kv">${rows.map(([k,v])=>`<div><span>${k}</span>${k==="地址"?v:esc(v)}</div>`).join("")}</div>
   <div class="btns"><a class="inst" href="${esc(link(it))}" >${svg("down")}${btnText(it)}</a>
   <button class="inst ghost" onclick="copy('${esc(it.url)}')">复制链接</button></div>`;
  $("detm").classList.add("show");
}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("已复制"),()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();toast("已复制")})}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600)}
function hide(id){$(id).classList.remove("show")}
function openCmd(){$("cmd").classList.add("show");$("cq").value="";search();setTimeout(()=>$("cq").focus(),30)}
const TN={plugin:"插件",rule:"分流",egern:"Egern",site:"网站"};
function search(){
  const q=$("cq").value.trim().toLowerCase();
  hits=ALL.filter(i=>!q||(i.name+" "+(i.desc||"")+" "+(i.policy||"")+" "+i.cat).toLowerCase().includes(q)).slice(0,40);sel=0;drawRes();
}
function drawRes(){
  $("res").innerHTML=hits.length?hits.map((it,n)=>`<div class="ri${n===sel?" sel":""}" onclick="detail('${it.id}')">${avatar(it)}<div><b>${esc(it.name)}</b><small>${esc((it.desc||sub(it)||"").slice(0,34))}</small></div><em>${TN[it.type]}</em></div>`).join(""):'<div style="padding:30px;text-align:center;color:var(--muted);font-size:14px">没有找到</div>';
}
$("cq").oninput=search;
$("cq").onkeydown=e=>{if(e.key==="ArrowDown"){sel=Math.min(sel+1,hits.length-1);drawRes();e.preventDefault()}else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);drawRes();e.preventDefault()}else if(e.key==="Enter"&&hits[sel])detail(hits[sel].id)};
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openCmd()}if(e.key==="Escape"){hide("cmd");hide("detm")}});
function toggleTheme(){const d=document.documentElement.classList.toggle("dark");localStorage.setItem("zht2_theme",d?"dark":"light")}
const th=localStorage.getItem("zht2_theme");if(th?th==="dark":matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("dark");
$("yr").textContent=new Date().getFullYear();
if(!TABS.find(t=>t.k===tab))tab="plugins";
const on=TABS.flatMap(t=>t.items).filter(i=>i.on).length;
$("stats").innerHTML=TABS.map(t=>`<span><b>${t.items.length}</b> ${{plugins:"个插件",rules:"条分流",egern:"个 Egern 模块"}[t.k]}</span>`).join("")+`<span><b>${on}</b> 个启用中</span>`;
render();
</script>
</body>
</html>
